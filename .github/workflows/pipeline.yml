name: Portfolio Allocator Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib pytest

      - name: Run tests
        run: python -m pytest

      - name: Generate Visual Artifact
        run: python src/allocator.py

      - name: Commit and Push Chart
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_allocation.png
          git commit -m "chore: auto-update portfolio allocation chart [skip ci]" || true
          git push
